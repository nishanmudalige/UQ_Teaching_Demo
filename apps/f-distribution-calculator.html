<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F Distribution Probability Calculator</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
  <style>
    :root {
      --uq-purple: #51247A;
      --uq-purple-dark: #37145A;
      --uq-purple-mid: #6B3FA0;
      --uq-purple-light: #EDE7F6;
      --uq-purple-soft: #F8F4FC;
      --uq-gold: #FBB800;
      --uq-text: #2F3437;
      --uq-muted: #667174;
      --uq-border: #D8C6EA;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--uq-text);
      background: linear-gradient(180deg, #ffffff 0%, var(--uq-purple-soft) 100%);
    }
    .page { padding: 8px 10px; }
    .app-title {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--uq-purple-dark);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 235px;
      gap: 8px;
      align-items: stretch;
    }
    .plot-card, .panel, .answer-card {
      background: #ffffff;
      border: 1px solid var(--uq-border);
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(81, 36, 122, 0.10);
    }
    .plot-card { padding: 8px 10px; }
    #plot { width: 100%; height: 220px; }
    .answer-card {
      padding: 8px 12px;
      margin-bottom: 6px;
      border-left: 7px solid var(--uq-purple);
      background: linear-gradient(160deg, var(--uq-purple-light), #ffffff);
    }
    .formula { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
    .probability { font-size: 20px; font-weight: 700; color: var(--uq-purple-dark); }
    .subtitle { font-size: 11.5px; color: var(--uq-muted); }
    .panel { padding: 8px 10px; }
    label { display: block; font-weight: 700; margin: 7px 0 3px 0; font-size: 11.5px; }
    input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--uq-border);
      border-radius: 8px;
      font-size: 11.5px;
      background: white;
    }
    .radio-row { display: flex; gap: 10px; margin-top: 8px; }
    .radio-row label { display: flex; align-items: center; gap: 5px; font-weight: 400; margin: 0; }
    .radio-row input { width: auto; }
    .note {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--uq-border);
      color: var(--uq-muted);
      font-size: 11.5px;
      line-height: 1.35;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      #plot { height: 260px; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="app-title">F-distribution probability calculator</div>
  <div class="layout">
    <div>
      <div class="answer-card">
        <div id="formula" class="formula"></div>
        <div id="probability" class="probability"></div>
        <div id="subtitle" class="subtitle"></div>
      </div>
      <div class="plot-card"><div id="plot"></div></div>
    </div>
    <div class="panel">
      <label>Tail area</label>
      <div class="radio-row">
        <label><input type="radio" name="tail" value="right" checked> Right tail</label>
        <label><input type="radio" name="tail" value="left"> Left tail</label>
      </div>
      <label for="fValue">F value</label>
      <input id="fValue" type="number" value="3.00" min="0" step="0.01">
      <label for="df1">Numerator degrees of freedom, df1</label>
      <input id="df1" type="number" value="4" min="1" step="1">
      <label for="df2">Denominator degrees of freedom, df2</label>
      <input id="df2" type="number" value="20" min="1" step="1">
      <div class="note">For one-way ANOVA, the usual P-value is the right-tail probability: P(F ≥ observed F).</div>
    </div>
  </div>
</div>
<script>
  const plotDiv = document.getElementById('plot');
  function fmt(x){ return Number(x).toFixed(3); }
  function fmtProb(p){ if(!isFinite(p)) return ''; if(p < 1e-4) return p.toExponential(3); return p.toFixed(6); }
  function clamp(p){ return Math.max(0, Math.min(1, p)); }
  function seq(a,b,n){ const out=[]; const step=(b-a)/(n-1); for(let i=0;i<n;i++) out.push(a+i*step); return out; }
  function tail(){ return document.querySelector('input[name="tail"]:checked').value; }
  function safePositiveInteger(id){ return Math.max(1, Math.round(Number(document.getElementById(id).value))); }
  function calculate(){
    const value = Math.max(0, Number(document.getElementById('fValue').value));
    const df1 = safePositiveInteger('df1');
    const df2 = safePositiveInteger('df2');
    const isRight = tail() === 'right';
    const cdf = jStat.centralF.cdf(value, df1, df2);
    const p = clamp(isRight ? 1 - cdf : cdf);
    const symbol = isRight ? '≥' : '≤';
    const tailName = isRight ? 'Right tail' : 'Left tail';
    const q995 = jStat.centralF.inv(0.995, df1, df2);
    let xMax = Math.max(5, value * 1.35 + 1, isFinite(q995) ? q995 : 5);
    xMax = Math.min(xMax, 50);
    const x = seq(0.0001, xMax, 1200);
    const y = x.map(xx => jStat.centralF.pdf(xx, df1, df2));
    const shadeX=[], shadeY=[];
    for(let i=0;i<x.length;i++){
      if((isRight && x[i] >= value) || (!isRight && x[i] <= value)) { shadeX.push(x[i]); shadeY.push(y[i]); }
    }
    const polygonX = shadeX.length ? [shadeX[0], ...shadeX, shadeX[shadeX.length-1]] : [];
    const polygonY = shadeY.length ? [0, ...shadeY, 0] : [];
    const cutoffY = jStat.centralF.pdf(value, df1, df2);
    document.getElementById('formula').textContent = `P(F ${symbol} ${fmt(value)})`;
    document.getElementById('probability').textContent = fmtProb(p);
    document.getElementById('subtitle').textContent = `F(${df1}, ${df2}) distribution | ${tailName} probability`;
    const data = [
      { x: polygonX, y: polygonY, type: 'scatter', mode: 'lines', fill: 'toself', fillcolor: 'rgba(81,36,122,0.28)', line: {color: 'rgba(81,36,122,0)'}, hoverinfo: 'skip', name: 'Selected tail' },
      { x: x, y: y, type: 'scatter', mode: 'lines', line: {color: '#2F3437', width: 3}, hoverinfo: 'skip', name: 'Density' },
      { x: [value, value], y: [0, cutoffY], type: 'scatter', mode: 'lines', line: {color: '#51247A', width: 3}, hoverinfo: 'skip', showlegend: false }
    ];
    const layout = {
      margin: {l: 48, r: 16, t: 8, b: 42},
      paper_bgcolor: 'white', plot_bgcolor: 'white', dragmode: false,
      xaxis: {title: 'F', range: [0, xMax], fixedrange: true, zeroline: false, gridcolor: '#ece6f3'},
      yaxis: {title: 'Density', fixedrange: true, rangemode: 'tozero', gridcolor: '#ece6f3'},
      showlegend: false,
      legend: {x: 0.98, y: 0.98, xanchor: 'right', yanchor: 'top', bgcolor: 'rgba(255,255,255,0.85)'},
      font: {family: 'Arial, Helvetica, sans-serif', color: '#2F3437'}
    };
    const config = {displayModeBar: false, scrollZoom: false, doubleClick: false, responsive: true, staticPlot: true};
    Plotly.react(plotDiv, data, layout, config);
  }
  document.querySelectorAll('input').forEach(el => { el.addEventListener('input', calculate); el.addEventListener('change', calculate); });
  calculate();
</script>
</body>
</html>
