project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - "pages/*.qmd"
    - "slides/*.qmd"
  resources:
    - data/
    - images/
    - apps/
    - R/
    - .nojekyll

website:
  title: "ANOVA"
  site-url: "https://nishanmudalige.github.io/UQ_Teaching_Demo"
  search: false
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: pages/anova-landing.qmd
        text: Chapter page
      - href: slides/anova-chapter.qmd
        text: Slides
      - href: data/incubation_data.csv
        text: Data

# The slide deck sets its own revealjs format in slides/anova-chapter.qmd.
# Declaring both formats here made every page render twice into the same
# file name, which failed the project render.
format:
  html:
    theme: flatly
    css: styles.css
    toc: false
    code-fold: true
    format-links: false
    include-in-header: mobile-zoom.html
